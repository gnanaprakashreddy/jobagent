name: Job Agent

on:
  schedule:
    - cron: "30 1 * * *" # daily 07:00 IST
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        type: choice
        default: run
        options: [run, search, rank, prepare, mark, followups, dashboard]
      args:
        description: 'Arguments, e.g. "42 applied" for mark, "42 57" or "--top 3" for prepare'
        required: false
        default: ""

permissions:
  contents: read
  models: read # free LLM via GitHub Models using GITHUB_TOKEN

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
      RESUME_B64: ${{ secrets.RESUME_B64 }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://models.github.ai/inference' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1-mini' }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      CMD: ${{ inputs.command || 'run' }}
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Check secrets
        run: |
          if [ -z "$PROFILE_JSON" ] || [ -z "$RESUME_B64" ]; then
            echo "::error::Add PROFILE_JSON and RESUME_B64 repository secrets (see README)."; exit 1
          fi

      # The tracker database persists between runs in the Actions cache (not publicly downloadable).
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-db-

      - name: Run agent
        run: node src/cli.js $CMD $ARGS

      - name: Build dashboard
        if: always()
        run: node src/cli.js dashboard

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Note: artifacts of a public repo can be downloaded by any signed-in GitHub user.
      - name: Upload application kits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-kits
          path: applications/
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site/

  deploy:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
